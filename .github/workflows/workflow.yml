name: 'Apply latest configuration to Fleet'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Nightly re-apply corrects drift

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  fleet-gitops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4

      - name: Apply latest configuration to Fleet
        uses: ./.github/gitops-action
        with:
          # Pull requests get a dry run only. Pushes to main apply.
          dry-run-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          # Free tier has no teams.
          delete-other-teams: 'false'
        env:
          FLEET_API_TOKEN: ${{ secrets.FLEET_API_TOKEN }}
          FLEET_URL: ${{ secrets.FLEET_URL }}
          FLEET_GLOBAL_ENROLL_SECRET: ${{ secrets.FLEET_GLOBAL_ENROLL_SECRET }}
